        type: integer
        minimum: 0
        description: Total number of posts
      cursorPrevious:
        type: integer
        nullable: true
      cursorNext:
        type: integer
        nullable: true
    required:
      - total
      - cursorPrevious
      - cursorNext
  rows:
    type: array
    items:
      $ref: ./PostResponse.yaml
