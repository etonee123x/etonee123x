get:
  operationId: getFolderData
  summary: Get folder data by path
  tags:
    - FolderData
  parameters:
    - in: query
      name: path
      required: false
      schema:
        type: string
      description: Path inside folder-data. Mutually exclusive with isNewest.
    - in: query
      name: isNewest
      required: false
      schema:
        type: boolean
        enum:
          - true
      description: Return newest folder data. Mutually exclusive with path.
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FolderDataResponse.yaml
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error404.yaml