get:
  operationId: getPosts
  summary: Get posts
  tags: 
    - Posts
  parameters:
    # - in: query
    #   name: cursorNext
    #   required: false
    #   schema:
    #     type: integer
    #     minimum: 0
    #     default: 0
    #   description: Cursor for the next page
    # - in: query
    #   name: cursorPrevious
    #   required: false
    #   schema:
    #     type: integer
    #     minimum: 0
    #     default: 0
    #   description: Cursor for the previous page
    # - in: query
    #   name: postId
    #   required: false
    #   schema:
    #     type: integer
    #     minimum: 0
    #     default: 0
    #   description: ID of the post
    - in: query
      name: filters
      required: false
      schema:
        type: object
        oneOf:
          - properties:
              cursorNext:
                type: integer
                minimum: 0
                description: Cursor for the next page
          - properties:
              cursorPrevious:
                type: integer
                minimum: 0
                description: Cursor for the previous page
          - properties:
              postId:
                type: string
                description: ID of the post
    - in: query
      name: pageSize
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Items per page
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PostsResponse.yaml
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error400.yaml

post:
  operationId: createPost
  summary: Create post
  tags: 
    - Posts
  security:
    - cookieAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: ../components/schemas/PostCreateRequest.yaml
  responses:
    "200":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PostResponse.yaml
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error400.yaml
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error401.yaml